# Render Web Service — one repo, both APIs on one URL
# Dashboard can match these values or import this file.
services:
  - type: web
    name: model-banana-disease
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
